[project]
site_name = "ratelimit-io"
site_description = "Distributed rate limiting for Python on Redis: fixed window, sliding window and GCRA, async and sync, for incoming and outgoing requests."
site_author = "bagowix"
site_url = "https://bagowix.github.io/ratelimit-io/"
repo_url = "https://github.com/bagowix/ratelimit-io"
copyright = "Copyright &copy; 2025-2026 ratelimit-io authors"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Guides" = ["guides/algorithms.md", "guides/keys.md", "guides/waiting.md"] },
    { "Frameworks" = "frameworks.md" },
    { "Migrating from 0.x" = "migration.md" },
    { "Reference" = "reference.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

# Titles for readers who have not arrived yet: search results, pasted links,
# social cards. Keyed by page url ("" is the landing page), consumed by the
# htmltitle and extrahead blocks in overrides/main.html, which append the site
# name. Keep each under ~60 characters or search engines truncate it. A page
# left out of this map keeps the theme's "<page title> - ratelimit-io".
[project.extra.seo_titles]
"" = "Distributed rate limiting for Python on Redis"
"getting-started/" = "Getting started with Redis rate limiting in Python"
"guides/algorithms/" = "Fixed window, sliding window and GCRA rate limits"
"guides/keys/" = "Rate limit keys and buckets in Redis"
"guides/waiting/" = "Waiting for a rate limit slot in outgoing calls"
"frameworks/" = "Rate limiting FastAPI, Django and Flask with Redis"
"migration/" = "Migrating to ratelimit-io 1.0"
"reference/" = "ratelimit-io API reference"
